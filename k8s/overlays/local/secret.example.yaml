# cp secret.example.yaml secret.yaml && edit GROQ_API_KEY
apiVersion: v1
kind: Secret
metadata:
  name: olliveai-secrets
  namespace: olliveai
type: Opaque
stringData:
  POSTGRES_PASSWORD: ollive
  DATABASE_URL: postgresql://ollive:ollive@postgres:5432/olliveai
  GROQ_API_KEY: gsk_your_key_here
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
