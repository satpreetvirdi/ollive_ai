# Copy to secret.yaml, fill values, apply once. DO NOT commit secret.yaml.
# kubectl apply -f k8s/base/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: olliveai-secrets
  namespace: olliveai
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  # App connection string (password must match POSTGRES_PASSWORD above)
  DATABASE_URL: "postgresql://ollive:change-me@postgres:5432/olliveai"
  GROQ_API_KEY: "gsk_your_key"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
