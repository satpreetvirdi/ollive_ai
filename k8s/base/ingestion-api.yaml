apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: olliveai
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: ingestion-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: olliveai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do sleep 2; done
        - name: wait-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do sleep 2; done
      containers:
        - name: ingestion-api
          image: olliveai/ingestion-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: olliveai-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: olliveai-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 15
